<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luna & Kricket Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1b1b1f;
            color: white;
        }

        /* PASSWORD SCREEN */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .loginBox {
            width: 100%;
            max-width: 400px;
            background: #292930;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .loginBox h1 {
            margin-top: 0;
        }

        .loginBox input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #3a3a43;
            color: white;
            outline: none;
        }

        .loginBox button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .loginBox button:hover {
            background: #7c74ff;
        }

        #loginError {
            color: #ff7070;
            margin-top: 12px;
            display: none;
        }

        /* NAME SCREEN */

        #nameScreen {
            min-height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .nameBox {
            width: 100%;
            max-width: 400px;
            background: #292930;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
        }

        .nameButton {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            color: white;
            background: #444450;
            cursor: pointer;
        }

        .nameButton:hover {
            background: #555562;
        }

        /* CHAT */

        #chatScreen {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        .chatHeader {
            background: #292930;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #41414a;
        }

        .chatHeader h2 {
            margin: 0;
            font-size: 20px;
        }

        #currentUser {
            font-size: 13px;
            color: #aaaab5;
        }

        #lockButton {
            background: #444450;
            border: none;
            color: white;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 12px 15px;
            border-radius: 15px;
            word-wrap: break-word;
        }

        .message.mine {
            align-self: flex-end;
            background: #6c63ff;
            border-bottom-right-radius: 4px;
        }

        .message.theirs {
            align-self: flex-start;
            background: #34343d;
            border-bottom-left-radius: 4px;
        }

        .sender {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .messageText {
            font-size: 16px;
            line-height: 1.4;
        }

        .time {
            font-size: 11px;
            opacity: 0.65;
            margin-top: 5px;
        }

        .divider {
            height: 1px;
            background: #34343c;
            width: 100%;
        }

        /* MESSAGE INPUT */

        .inputArea {
            background: #292930;
            padding: 12px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #41414a;
        }

        #messageInput {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #3a3a43;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #sendButton {
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #7c74ff;
        }

        @media (max-width: 600px) {

            .message {
                max-width: 85%;
            }

            .chatHeader h2 {
                font-size: 17px;
            }

            #messages {
                padding: 12px;
            }

        }
    </style>
</head>

<body>

<!-- PASSWORD SCREEN -->

<div id="loginScreen">

    <div class="loginBox">

        <h1>🔒 Private Chat</h1>

        <p>Enter the password to continue.</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Password"
        >

        <button onclick="checkPassword()">
            Enter Chat
        </button>

        <div id="loginError">
            Incorrect password.
        </div>

    </div>

</div>


<!-- NAME SCREEN -->

<div id="nameScreen">

    <div class="nameBox">

        <h1>Who's chatting?</h1>

        <p>Select your name.</p>

        <button
            class="nameButton"
            onclick="selectName('Luna')">
            Luna
        </button>

        <button
            class="nameButton"
            onclick="selectName('Kricket')">
            Kricket
        </button>

    </div>

</div>


<!-- CHAT SCREEN -->

<div id="chatScreen">

    <div class="chatHeader">

        <div>
            <h2>💬 Luna & Kricket</h2>
            <span id="currentUser"></span>
        </div>

        <button id="lockButton" onclick="lockChat()">
            🔒 Lock
        </button>

    </div>


    <div id="messages"></div>


    <div class="inputArea">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        push,
        onValue
    }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    /* YOUR FIREBASE CONFIG */

    const firebaseConfig = {

        apiKey: "AIzaSyAFXcjrFBcZD2ZY1e9uMzmqftLTngd6Vv8",

        authDomain:
            "luna-and-kricket.firebaseapp.com",

        databaseURL:
            "https://luna-and-kricket-default-rtdb.firebaseio.com",

        projectId:
            "luna-and-kricket",

        storageBucket:
            "luna-and-kricket.firebasestorage.app",

        messagingSenderId:
            "577641967559",

        appId:
            "1:577641967559:web:5cf0c7b84555ac277773e2",

        measurementId:
            "G-76LCKDY8NW"
    };


    /* START FIREBASE */

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    /* VARIABLES */

    let currentUser = null;


    /*
       PASSWORD
    */

    window.checkPassword = function () {

        const password =
            document.getElementById("passwordInput").value;

        if (password === "011825") {

            document.getElementById("loginScreen")
                .style.display = "none";

            document.getElementById("nameScreen")
                .style.display = "flex";

        } else {

            document.getElementById("loginError")
                .style.display = "block";

        }

    };


    /*
       SELECT NAME
    */

    window.selectName = function (name) {

        currentUser = name;

        document.getElementById("nameScreen")
            .style.display = "none";

        document.getElementById("chatScreen")
            .style.display = "flex";

        document.getElementById("currentUser")
            .textContent = "You are " + name;

        loadMessages();

    };


    /*
       SEND MESSAGE
    */

    window.sendMessage = function () {

        const input =
            document.getElementById("messageInput");

        const text = input.value.trim();

        if (text === "" || currentUser === null) {
            return;
        }


        const messagesRef =
            ref(database, "messages");


        push(messagesRef, {

            sender: currentUser,

            text: text,

            timestamp: Date.now()

        });


        input.value = "";

        input.focus();

    };


    /*
       ENTER KEY SENDS MESSAGE
    */

    document
        .getElementById("messageInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        });


    /*
       LOAD REAL-TIME MESSAGES
    */

    function loadMessages() {

        const messagesRef =
            ref(database, "messages");


        onValue(messagesRef, function(snapshot) {

            const messagesContainer =
                document.getElementById("messages");

            messagesContainer.innerHTML = "";


            const data = snapshot.val();

            if (!data) {
                return;
            }


            const messages =
                Object.values(data);


            messages.sort(function(a, b) {

                return a.timestamp - b.timestamp;

            });


            messages.forEach(function(message) {

                const messageBox =
                    document.createElement("div");

                messageBox.classList.add("message");


                if (message.sender === currentUser) {

                    messageBox.classList.add("mine");

                } else {

                    messageBox.classList.add("theirs");

                }


                const sender =
                    document.createElement("div");

                sender.className = "sender";

                sender.textContent =
                    message.sender;


                const messageText =
                    document.createElement("div");

                messageText.className = "messageText";

                messageText.textContent =
                    message.text;


                const time =
                    document.createElement("div");

                time.className = "time";

                time.textContent =
                    formatTime(message.timestamp);


                messageBox.appendChild(sender);

                messageBox.appendChild(messageText);

                messageBox.appendChild(time);


                messagesContainer.appendChild(messageBox);


                const divider =
                    document.createElement("div");

                divider.className = "divider";

                messagesContainer.appendChild(divider);

            });


            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        });

    }


    /*
       FORMAT TIME
    */

    function formatTime(timestamp) {

        const date =
            new Date(timestamp);

        return date.toLocaleString([], {

            month: "short",

            day: "numeric",

            hour: "numeric",

            minute: "2-digit"

        });

    }


    /*
       LOCK CHAT
    */

    window.lockChat = function () {

        currentUser = null;

        document.getElementById("chatScreen")
            .style.display = "none";

        document.getElementById("nameScreen")
            .style.display = "none";

        document.getElementById("loginScreen")
            .style.display = "flex";

        document.getElementById("passwordInput")
            .value = "";

    };

</script>

</body>
</html>
