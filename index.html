<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luna & Kricket Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1b1b1f;
            color: white;
        }

        /* PASSWORD SCREEN */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .loginBox {
            width: 100%;
            max-width: 400px;
            background: #292930;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .loginBox h1 {
            margin-top: 0;
        }

        .loginBox input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #3a3a43;
            color: white;
            outline: none;
        }

        .loginBox button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .loginBox button:hover {
            background: #7c74ff;
        }

        #loginError {
            color: #ff7070;
            margin-top: 12px;
            display: none;
        }

        /* NAME SCREEN */

        #nameScreen {
            min-height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .nameBox {
            width: 100%;
            max-width: 400px;
            background: #292930;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .nameButton {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            color: white;
            background: #444450;
            cursor: pointer;
        }

        .nameButton:hover {
            background: #555562;
        }

        /* CHAT */

        #chatScreen {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        .chatHeader {
            background: #292930;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #41414a;
        }

        .chatHeader h2 {
            margin: 0;
            font-size: 20px;
        }

        #currentUser {
            font-size: 13px;
            color: #aaaab5;
        }

        #lockButton {
            background: #444450;
            border: none;
            color: white;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 12px 15px;
            border-radius: 15px;
            word-wrap: break-word;
        }

        .message.mine {
            align-self: flex-end;
            background: #6c63ff;
            border-bottom-right-radius: 4px;
        }

        .message.theirs {
            align-self: flex-start;
            background: #34343d;
            border-bottom-left-radius: 4px;
        }

        .sender {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .messageText {
            font-size: 16px;
            line-height: 1.4;
        }

        .time {
            font-size: 11px;
            opacity: 0.65;
            margin-top: 5px;
        }

        .divider {
            height: 1px;
            background: #34343c;
            width: 100%;
        }

        /* STATUS */

        #firebaseStatus {
            font-size: 12px;
            margin-top: 3px;
            color: #aaaab5;
        }

        #firebaseStatus.connected {
            color: #75e08a;
        }

        #firebaseStatus.error {
            color: #ff7070;
        }

        #firebaseStatus.loading {
            color: #ffd166;
        }

        /* MESSAGE INPUT */

        .inputArea {
            background: #292930;
            padding: 12px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #41414a;
        }

        #messageInput {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #3a3a43;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #sendButton {
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #7c74ff;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* FIREBASE ERROR */

        #firebaseError {
            display: none;
            margin: 10px 20px 0 20px;
            padding: 12px;
            background: #3b2528;
            border: 1px solid #70343a;
            border-radius: 10px;
            color: #ff9b9b;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .message {
                max-width: 85%;
            }

            .chatHeader h2 {
                font-size: 17px;
            }

            #messages {
                padding: 12px;
            }

            .inputArea {
                padding: 10px;
            }

            #sendButton {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

<!-- PASSWORD SCREEN -->

<div id="loginScreen">

    <div class="loginBox">

        <h1>🔒 Private Chat</h1>

        <p>Enter the password to continue.</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Password"
        >

        <button onclick="checkPassword()">
            Enter Chat
        </button>

        <div id="loginError">
            Incorrect password.
        </div>

    </div>

</div>


<!-- NAME SCREEN -->

<div id="nameScreen">

    <div class="nameBox">

        <h1>Who's chatting?</h1>

        <p>Select your name.</p>

        <button
            class="nameButton"
            onclick="selectName('Luna')">
            Luna
        </button>

        <button
            class="nameButton"
            onclick="selectName('Kricket')">
            Kricket
        </button>

    </div>

</div>


<!-- CHAT SCREEN -->

<div id="chatScreen">

    <div class="chatHeader">

        <div>

            <h2>💬 Luna & Kricket</h2>

            <span id="currentUser"></span>

            <div id="firebaseStatus" class="loading">
                Connecting to chat...
            </div>

        </div>

        <button id="lockButton" onclick="lockChat()">
            🔒 Lock
        </button>

    </div>


    <!-- FIREBASE ERROR -->

    <div id="firebaseError"></div>


    <!-- MESSAGES -->

    <div id="messages"></div>


    <!-- MESSAGE INPUT -->

    <div class="inputArea">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        push,
        onValue,
        onDisconnect
    }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    /* =========================================
       FIREBASE CONFIG
       ========================================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyAFXcjrFBcZD2ZY1e9uMzmqftLTngd6Vv8",

        authDomain:
            "luna-and-kricket.firebaseapp.com",

        databaseURL:
            "https://luna-and-kricket-default-rtdb.firebaseio.com",

        projectId:
            "luna-and-kricket",

        storageBucket:
            "luna-and-kricket.firebasestorage.app",

        messagingSenderId:
            "577641967559",

        appId:
            "1:577641967559:web:5cf0c7b84555ac277773e2",

        measurementId:
            "G-76LCKDY8NW"

    };


    /* =========================================
       START FIREBASE
       ========================================= */

    const app =
        initializeApp(firebaseConfig);

    const database =
        getDatabase(app);


    /* =========================================
       VARIABLES
       ========================================= */

    let currentUser = null;

    let messagesListener = null;


    /* =========================================
       STATUS FUNCTIONS
       ========================================= */

    function setStatus(text, type) {

        const status =
            document.getElementById("firebaseStatus");

        status.textContent = text;

        status.className = type;

    }


    function showFirebaseError(message) {

        const errorBox =
            document.getElementById("firebaseError");

        errorBox.textContent =
            "Firebase error: " + message;

        errorBox.style.display = "block";

    }


    function hideFirebaseError() {

        const errorBox =
            document.getElementById("firebaseError");

        errorBox.style.display = "none";

    }


    /* =========================================
       PASSWORD
       ========================================= */

    window.checkPassword = function () {

        const password =
            document.getElementById("passwordInput").value;

        const error =
            document.getElementById("loginError");


        if (password === "011825") {

            error.style.display = "none";

            document.getElementById("loginScreen")
                .style.display = "none";

            document.getElementById("nameScreen")
                .style.display = "flex";

        }

        else {

            error.style.display = "block";

        }

    };


    /* =========================================
       PASSWORD ENTER KEY
       ========================================= */

    document
        .getElementById("passwordInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                checkPassword();

            }

        });


    /* =========================================
       SELECT NAME
       ========================================= */

    window.selectName = function (name) {

        currentUser = name;


        document.getElementById("nameScreen")
            .style.display = "none";

        document.getElementById("chatScreen")
            .style.display = "flex";


        document.getElementById("currentUser")
            .textContent = "You are " + name;


        hideFirebaseError();

        setStatus(
            "Connecting to chat...",
            "loading"
        );


        loadMessages();

    };


    /* =========================================
       SEND MESSAGE
       ========================================= */

    window.sendMessage = async function () {

        const input =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const text =
            input.value.trim();


        if (text === "" || currentUser === null) {
            return;
        }


        const messagesRef =
            ref(database, "messages");


        sendButton.disabled = true;


        try {

            await push(messagesRef, {

                sender: currentUser,

                text: text,

                timestamp: Date.now()

            });


            input.value = "";

            input.focus();


            hideFirebaseError();

            setStatus(
                "Connected",
                "connected"
            );

        }

        catch (error) {

            console.error(
                "Error sending message:",
                error
            );


            showFirebaseError(
                getFirebaseErrorMessage(error)
            );


            setStatus(
                "Connection error",
                "error"
            );

        }

        finally {

            sendButton.disabled = false;

        }

    };


    /* =========================================
       ENTER KEY SENDS MESSAGE
       ========================================= */

    document
        .getElementById("messageInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        });


    /* =========================================
       LOAD REAL-TIME MESSAGES
       ========================================= */

    function loadMessages() {

        const messagesRef =
            ref(database, "messages");


        /*
           Prevent duplicate listeners.
        */

        if (messagesListener) {

            messagesListener();

            messagesListener = null;

        }


        messagesListener = onValue(

            messagesRef,

            function(snapshot) {

                hideFirebaseError();

                setStatus(
                    "Connected",
                    "connected"
                );


                const messagesContainer =
                    document.getElementById("messages");


                messagesContainer.innerHTML = "";


                const data =
                    snapshot.val();


                /*
                   No messages yet.
                */

                if (!data) {

                    const emptyMessage =
                        document.createElement("div");

                    emptyMessage.style.textAlign =
                        "center";

                    emptyMessage.style.opacity =
                        "0.5";

                    emptyMessage.style.marginTop =
                        "30px";

                    emptyMessage.textContent =
                        "No messages yet. Start the conversation!";

                    messagesContainer.appendChild(
                        emptyMessage
                    );

                    return;

                }


                /*
                   Convert Firebase data
                   into an array.
                */

                const messages =
                    Object.entries(data).map(
                        function([id, message]) {

                            return {

                                id: id,

                                ...message

                            };

                        }
                    );


                /*
                   Sort oldest → newest.
                */

                messages.sort(function(a, b) {

                    return (
                        (a.timestamp || 0) -
                        (b.timestamp || 0)
                    );

                });


                /*
                   Display every message.
                */

                messages.forEach(function(message) {

                    const messageBox =
                        document.createElement("div");


                    messageBox.classList.add(
                        "message"
                    );


                    /*
                       Determine which side
                       the message belongs on.
                    */

                    if (
                        message.sender ===
                        currentUser
                    ) {

                        messageBox.classList.add(
                            "mine"
                        );

                    }

                    else {

                        messageBox.classList.add(
                            "theirs"
                        );

                    }


                    /*
                       Sender name
                    */

                    const sender =
                        document.createElement("div");


                    sender.className =
                        "sender";


                    sender.textContent =
                        message.sender ||
                        "Unknown";


                    /*
                       Message text
                    */

                    const messageText =
                        document.createElement("div");


                    messageText.className =
                        "messageText";


                    messageText.textContent =
                        message.text || "";


                    /*
                       Time
                    */

                    const time =
                        document.createElement("div");


                    time.className =
                        "time";


                    time.textContent =
                        formatTime(
                            message.timestamp
                        );


                    /*
                       Build message box.
                    */

                    messageBox.appendChild(
                        sender
                    );

                    messageBox.appendChild(
                        messageText
                    );

                    messageBox.appendChild(
                        time
                    );


                    messagesContainer.appendChild(
                        messageBox
                    );


                    /*
                       Divider
                    */

                    const divider =
                        document.createElement("div");


                    divider.className =
                        "divider";


                    messagesContainer.appendChild(
                        divider
                    );

                });


                /*
                   Scroll to newest message.
                */

                messagesContainer.scrollTop =
                    messagesContainer.scrollHeight;

            },

            function(error) {

                /*
                   THIS IS THE IMPORTANT PART.

                   If Firebase refuses to READ the
                   database, this function catches it.
                */

                console.error(
                    "Firebase read error:",
                    error
                );


                setStatus(
                    "Firebase read error",
                    "error"
                );


                showFirebaseError(
                    getFirebaseErrorMessage(error)
                );

            }

        );

    }


    /* =========================================
       FIREBASE ERROR TRANSLATOR
       ========================================= */

    function getFirebaseErrorMessage(error) {

        if (!error) {

            return "Unknown Firebase error.";

        }


        if (
            error.code ===
            "PERMISSION_DENIED"
        ) {

            return (
                "Permission denied. " +
                "Check your Realtime Database Rules. " +
                "The website can reach Firebase, " +
                "but Firebase is refusing the read."
            );

        }


        if (
            error.code ===
            "PERMISSION_DENIED: permission_denied"
        ) {

            return (
                "Permission denied. " +
                "Check your Realtime Database Rules."
            );

        }


        return (
            error.message ||
            "Could not connect to Firebase."
        );

    }


    /* =========================================
       FORMAT TIME
       ========================================= */

    function formatTime(timestamp) {

        if (!timestamp) {

            return "";

        }


        const date =
            new Date(timestamp);


        return date.toLocaleString([], {

            month: "short",

            day: "numeric",

            hour: "numeric",

            minute: "2-digit"

        });

    }


    /* =========================================
       LOCK CHAT
       ========================================= */

    window.lockChat = function () {

        currentUser = null;


        /*
           Stop Firebase listener.
        */

        if (messagesListener) {

            messagesListener();

            messagesListener = null;

        }


        document.getElementById("chatScreen")
            .style.display = "none";


        document.getElementById("nameScreen")
            .style.display = "none";


        document.getElementById("loginScreen")
            .style.display = "flex";


        document.getElementById("passwordInput")
            .value = "";


        document.getElementById("messages")
            .innerHTML = "";


        hideFirebaseError();


        setStatus(
            "Connecting to chat...",
            "loading"
        );

    };

</script>

</body>
</html>
